<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Удалили Google Font: Apple стиль использует системные шрифты устройства -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --accent: #a855f7;
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.6); /* Чуть прозрачнее для эффекта стекла */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.015em; /* Изящный отступ между буквами */
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 25%);
            color: #fafafa;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step-active {
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .step-locked {
            opacity: 0.4;
            filter: grayscale(0.8);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Apple Style: Полустеклянные кнопки */
        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Изящные шрифты для заголовков, чтобы не сливались */
        h1, h2, h3, .tracking-tight {
            letter-spacing: 0.03em !important;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="p-4 pb-20" oncontextmenu="return false;">

    <header class="flex justify-between items-center mb-8 pt-4">
        <div>
            <div class="flex items-center gap-2">
                <h1 id="academy-name" class="text-2xl font-extrabold tracking-tight" onclick="handleAdminTrigger()">Cyber Academy</h1>
                <div id="cloud-indicator" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-colors duration-500" title="Нет связи с облаком"></div>
            </div>
            <div class="flex items-center gap-2 mt-1">
                <div class="h-1.5 w-24 bg-zinc-800 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-purple-500 transition-all duration-500" style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-[10px] text-zinc-400 font-bold uppercase tracking-tighter">0% Пройдено</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="admin-btn" onclick="openAdmin()" class="hidden w-12 h-12 rounded-2xl bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center transition-all">
                <i data-lucide="settings" class="text-zinc-400 w-6 h-6"></i>
            </button>
            <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center">
                <i data-lucide="zap" class="text-purple-500 w-6 h-6"></i>
            </div>
        </div>
    </header>

    <div id="modules-container" class="space-y-4"></div>

    <div id="access-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto flex items-center justify-center">
        <div class="p-6 w-full max-w-md flex flex-col">
            <div class="glass-card p-6 space-y-6 relative">
                <button onclick="closeAccessModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <div class="text-center">
                    <div class="w-16 h-16 bg-purple-500/10 rounded-2xl mx-auto flex items-center justify-center mb-4 border border-purple-500/20">
                        <i data-lucide="lock" class="w-8 h-8 text-purple-400"></i>
                    </div>
                    <h2 class="text-xl font-bold mb-2">Доступ закрыт</h2>
                    <p class="text-zinc-400 text-sm">Введите код доступа, который вы получили после оплаты курса.</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="access-code-input" placeholder="Введите код..." class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center tracking-widest text-lg font-mono outline-none focus:border-purple-500 transition-all">
                    <button onclick="checkAccessCode()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm">
                        Отправить код
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="lesson-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto">
        <div class="p-6 min-h-screen flex flex-col">
            <button onclick="closeLesson()" class="flex items-center gap-2 text-zinc-400 mb-6 text-sm">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> Назад к программе
            </button>

            <div class="glass-card p-4 mb-6">
                <div class="video-container mb-4" oncontextmenu="return false;" ondragstart="return false;">
                    <!-- sandbox без allow-popups блокирует переход на ресурс -->
                    <iframe id="lesson-video" src="" frameborder="0" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
                </div>
                <h2 id="lesson-title" class="text-xl font-bold mb-2"></h2>
                <p id="lesson-desc" class="text-zinc-400 text-sm leading-relaxed mb-4">
                    В этом уроке мы изучим основы работы с нейросетями и разберем первые шаги.
                </p>
                <a id="lesson-pdf-btn" href="#" target="_blank" class="hidden flex items-center justify-center gap-2 w-full bg-zinc-800 hover:bg-zinc-700 text-sm font-bold py-3 rounded-xl mb-4 transition-all">
                    <i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i> Скачать материалы
                </a>
                <div class="flex items-center gap-3 p-3 bg-purple-500/5 border border-purple-500/10 rounded-xl">
                    <i data-lucide="alert-circle" class="text-purple-500 w-5 h-5"></i>
                    <div>
                        <p class="text-[10px] text-purple-300 font-bold uppercase">Дедлайн сдачи:</p>
                        <p id="lesson-deadline-timer" class="text-sm font-mono font-bold">00:00:00</p>
                    </div>
                </div>
            </div>

            <div class="mt-auto space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Ссылка на видео (YouTube, Rutube, Berrycast, Яндекс Диск)</label>
                    <input type="url" id="edit-mod-video" placeholder="https://... или код <iframe> с Яндекс Диска" oninput="updateAdminVideoPreview()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                    <div class="video-container mt-2">
                        <iframe id="edit-mod-video-preview" src="" frameborder="0" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Ссылка на документ (PDF/Материалы)</label>
                    <input type="url" id="edit-mod-pdf" placeholder="https://диск..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Дедлайн сдачи</label>
                    <input type="datetime-local" id="edit-mod-deadline" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all [color-scheme:dark]">
                </div>

                <button onclick="saveAdminModuleEdit()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm mt-4">
                    Сохранить урок
                </button>
            </div>
        </div>
    </div>

    <script>
        const academyData = {
            name: "Нейросети: Мастер",
            secretCode: "VIP2026",
            modules: [
                { id: 1, title: "Основы генерации", video: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", desc: "Узнаем как писать первые промпты.", deadline: "2026-03-01T12:00", pdfUrl: "" },
                { id: 2, title: "Работа с цветом", video: "", desc: "Глубокое погружение в колористику ИИ.", deadline: "2026-03-05T12:00", pdfUrl: "" },
                { id: 3, title: "Финальный проект", video: "", desc: "Создаем полноценный кейс для портфолио.", deadline: "2026-03-10T12:00", pdfUrl: "" },
                { id: 4, title: "Монетизация навыков", video: "", desc: "Учимся искать клиентов и продавать свои работы.", deadline: "2026-03-15T12:00", pdfUrl: "" }
            ]
        };

        let currentLevel = 1;
        let isAccessGranted = localStorage.getItem('academy_access_granted') === 'true';
        let currentViewedLesson = 0;

        function init() {
            document.getElementById('academy-name').innerText = academyData.name;
            renderModules();
            lucide.createIcons();
        }

        function renderModules() {
            const container = document.getElementById('modules-container');
            container.innerHTML = '';
            
            const progress = ((currentLevel - 1) / academyData.modules.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${Math.round(progress)}% Пройдено`;

            academyData.modules.forEach((mod, idx) => {
                const isLocked = (idx + 1) > currentLevel;
                const isDone = (idx + 1) < currentLevel;
                const isActive = (idx + 1) === currentLevel;

                container.innerHTML += `
                    <div class="glass-card p-5 flex items-center justify-between ${isActive ? 'step-active' : ''} ${isLocked ? 'step-locked' : ''}" 
                         onclick="${!isLocked ? `openLesson(${idx})` : ''}">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl ${isDone ? 'bg-emerald-500/10' : 'bg-zinc-800'} flex items-center justify-center text-sm font-bold">
                                ${isDone ? '<i data-lucide="check" class="text-emerald-500 w-5 h-5"></i>' : idx + 1}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm">${mod.title}</h3>
                                <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-tighter">
                                    ${isLocked ? 'Доступ закрыт' : 'Нажми, чтобы войти'}
                                </p>
                            </div>
                        </div>
                        ${isActive ? '<div class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></div>' : ''}
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function checkAccessCode() {
            const inputCode = document.getElementById('access-code-input').value.trim();
            if (inputCode === academyData.secretCode) {
                isAccessGranted = true;
                localStorage.setItem('academy_access_granted', 'true');
                
                if (window.auth && window.auth.currentUser && window.setDoc && window.doc && window.db) {
                    const uid = window.auth.currentUser.uid;
                    const nickname = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || 
                                     window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || 
                                     "Студент " + uid.substring(0, 4);
                    
                    window.setDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users', uid), {
                        nickname: nickname,
                        progress: currentLevel,
                        activatedAt: new Date().toISOString()
                    }, { merge: true });
                }

                closeAccessModal();
                openLesson(0);
            } else {
                alert('Неверный код доступа!');
            }
        }

        function closeAccessModal() {
            document.getElementById('access-modal').classList.add('hidden');
        }

        function openLesson(idx) {
            if (idx === 0 && academyData.secretCode && academyData.secretCode.trim() !== '' && !isAccessGranted) {
                document.getElementById('access-code-input').value = '';
                document.getElementById('access-modal').classList.remove('hidden');
                return;
            }

            currentViewedLesson = idx;
            
            const mod = academyData.modules[idx];
            document.getElementById('lesson-title').innerText = mod.title;
            document.getElementById('lesson-desc').innerText = mod.desc;
            document.getElementById('lesson-video').src = formatVideoUrl(mod.video) || '';
            
            const pdfBtn = document.getElementById('lesson-pdf-btn');
            if (mod.pdfUrl) {
                pdfBtn.href = mod.pdfUrl;
                pdfBtn.classList.remove('hidden');
            } else {
                pdfBtn.classList.add('hidden');
            }

            const d = new Date(mod.deadline);
            document.getElementById('lesson-deadline-timer').innerText = !isNaN(d) ? d.toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit'}) : "Не установлен";

            document.getElementById('lesson-modal').classList.remove('hidden');
        }

        function closeLesson() {
            document.getElementById('lesson-modal').classList.add('hidden');
            document.getElementById('lesson-video').src = '';
        }

        function submitHomework() {
            const hwInput = document.getElementById('hw-input').value.trim();
            const urlPattern = /^(https?:\/\/)/i;
            if (!urlPattern.test(hwInput)) {
                alert('Ошибка! Можно вводить только ссылки (строка должна начинаться с http:// или https://)');
                return;
            }

            alert('Заинька, работа отправлена! Ты молодец!');
            
            if (currentViewedLesson + 1 === currentLevel) {
                currentLevel++;

                if (window.auth && window.auth.currentUser && window.setDoc && window.doc && window.db) {
                    const uid = window.auth.currentUser.uid;
                    window.setDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users', uid), {
                        progress: currentLevel
                    }, { merge: true });
                }
            }

            document.getElementById('hw-input').value = '';
            closeLesson();
            renderModules();
        }

        let tapCount = 0;
        let tapTimer = null;

        function handleAdminTrigger() {
            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, 1500); 
            }
            if (tapCount >= 5) {
                clearTimeout(tapTimer);
                tapCount = 0;
                const adminBtn = document.getElementById('admin-btn');
                adminBtn.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function openAdmin() {
            document.getElementById('admin-academy-name').value = academyData.name;
            document.getElementById('admin-secret-code').value = academyData.secretCode || '';
            renderAdminModules();
            if (window.loadAdminUsers) window.loadAdminUsers();
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function renderAdminModules() {
            const list = document.getElementById('admin-modules-list');
            list.innerHTML = '';
            academyData.modules.forEach((mod, idx) => {
                list.innerHTML += `
                    <div onclick="openAdminModuleEdit(${idx})" class="flex items-center gap-3 bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/50 cursor-pointer hover:border-purple-500 transition-all">
                        <span class="text-zinc-500 text-sm font-bold w-4">${idx + 1}.</span>
                        <span class="flex-1 text-sm truncate">${mod.title}</span>
                        <i data-lucide="edit-3" class="w-4 h-4 text-zinc-400"></i>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function adminAddModule() {
            const newId = academyData.modules.length > 0 ? academyData.modules[academyData.modules.length - 1].id + 1 : 1;
            academyData.modules.push({
                id: newId,
                title: "Новый модуль",
                video: "",
                desc: "Описание модуля...",
                deadline: "2026-12-31T23:59",
                pdfUrl: ""
            });
            renderAdminModules();
        }

        function saveAdminChanges() {
            const newName = document.getElementById('admin-academy-name').value;
            if (newName) {
                academyData.name = newName;
                document.getElementById('academy-name').innerText = newName;
            }

            academyData.secretCode = document.getElementById('admin-secret-code').value.trim();

            renderModules();
            closeAdmin();
        }

        function closeAdmin() {
            if (window.adminUsersUnsubscribe) window.adminUsersUnsubscribe();
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function formatVideoUrl(url) {
            if (!url) return '';
            let formattedUrl = url.trim();
            
            // Если вставили код <iframe> (например, из Яндекс Диска)
            if (formattedUrl.includes('<iframe') && formattedUrl.includes('src=')) {
                const match = formattedUrl.match(/src=["'](.*?)["']/);
                if (match) return match[1];
            }
            
            if (formattedUrl.includes('youtube.com/watch?v=')) {
                const videoId = formattedUrl.split('v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${videoId}?modestbranding=1&rel=0&showinfo=0`;
            }
            if (formattedUrl.includes('youtu.be/')) {
                const videoId = formattedUrl.split('youtu.be/')[1].split('?')[0];
                return `https://www.youtube.com/embed/${videoId}?modestbranding=1&rel=0&showinfo=0`;
            }
            
            if (formattedUrl.includes('rutube.ru/video/')) {
                const videoId = formattedUrl.split('rutube.ru/video/')[1].replace(/\//g, '');
                return `https://rutube.ru/play/embed/${videoId}/`;
            }

            if (formattedUrl.includes('berrycast.com/conversations/') && !formattedUrl.includes('/embed')) {
                return formattedUrl.replace(/\/$/, '') + '/embed';
            }
            
            return formattedUrl;
        }

        function openAdminModuleEdit(idx) {
            const mod = academyData.modules[idx];
            document.getElementById('edit-mod-idx').value = idx;
            document.getElementById('edit-mod-title').value = mod.title || '';
            document.getElementById('edit-mod-desc').value = mod.desc || '';
            document.getElementById('edit-mod-video').value = mod.video || '';
            document.getElementById('edit-mod-pdf').value = mod.pdfUrl || '';
            document.getElementById('edit-mod-deadline').value = mod.deadline || '';
            
            updateAdminVideoPreview();
            
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-module-edit-modal').classList.remove('hidden');
        }

        function updateAdminVideoPreview() {
            const videoUrl = formatVideoUrl(document.getElementById('edit-mod-video').value);
            document.getElementById('edit-mod-video-preview').src = videoUrl;
        }

        function saveAdminModuleEdit() {
            const idx = document.getElementById('edit-mod-idx').value;
            const mod = academyData.modules[idx];
            
            mod.title = document.getElementById('edit-mod-title').value;
            mod.desc = document.getElementById('edit-mod-desc').value;
            mod.video = formatVideoUrl(document.getElementById('edit-mod-video').value);
            mod.pdfUrl = document.getElementById('edit-mod-pdf').value;
            mod.deadline = document.getElementById('edit-mod-deadline').value;

            closeAdminModuleEdit();
        }

        function closeAdminModuleEdit() {
            document.getElementById('admin-module-edit-modal').classList.add('hidden');
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('edit-mod-video-preview').src = '';
            renderAdminModules();
        }

        window.loadAdminUsers = function() {
            const list = document.getElementById('admin-users-list');
            if (!window.db || !window.query || !window.collection || !window.onSnapshot) {
                list.innerHTML = '<div class="text-sm text-red-500">Нет связи с БД</div>';
                return;
            }
            list.innerHTML = '<div class="text-sm text-zinc-500">Загрузка...</div>';
            
            const q = window.query(window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users'));
            window.adminUsersUnsubscribe = window.onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<div class="text-sm text-zinc-500">Пока никто не активировал код</div>';
                    return;
                }
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    list.innerHTML += `
                        <div class="flex items-center justify-between bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/50">
                            <div>
                                <p class="text-sm font-bold text-white">${data.nickname || 'Неизвестный'}</p>
                                <p class="text-[10px] text-zinc-400">Пройдено модулей: ${data.progress ? data.progress - 1 : 0}</p>
                            </div>
                            <button onclick="resetUserProgress('${docSnap.id}')" class="text-xs bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/20 hover:bg-red-500/20 transition-all">
                                Сбросить
                            </button>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Ошибка загрузки юзеров", error);
                list.innerHTML = '<div class="text-sm text-red-500">Ошибка загрузки</div>';
            });
        };

        window.resetUserProgress = async function(uid) {
            if (confirm("Точно сбросить прогресс этому студенту?")) {
                try {
                    await window.updateDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users', uid), {
                        progress: 1
                    });
                    
                    if (window.auth && window.auth.currentUser && window.auth.currentUser.uid === uid) {
                        currentLevel = 1;
                        renderModules();
                    }
                    alert("Прогресс сброшен!");
                } catch(e) {
                    console.error("Ошибка при сбросе", e);
                    alert("Произошла ошибка при сбросе");
                }
            }
        };

        init();
    </script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        onSnapshot, 
        collection, 
        query, 
        updateDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { 
        getAuth, 
        signInAnonymously, 
        onAuthStateChanged, 
        signInWithCustomToken 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCfUl6ZUnzhS-kwgHva9xEoct2Br8pfRQ8",

    window.sendToTelegram = async function(messageText) {
        if (!TG_BOT_TOKEN || !TG_CHAT_ID) {
            console.warn("Не задан TG_BOT_TOKEN или TG_CHAT_ID");
            return;
        }

        const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: messageText,
                    parse_mode: "HTML"
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Ошибка отправки в Telegram:", errorText);
            }
        } catch (error) {
            console.error("Ошибка отправки в Telegram:", error);
        }
    };

    function updateCloudIndicator(connected) {
        const indicator = document.getElementById('cloud-indicator');
        if (!indicator) return;

        if (connected) {
            indicator.classList.remove('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
            indicator.classList.add('bg-emerald-500', 'shadow-[0_0_8px_rgba(16,185,129,0.8)]');
            indicator.title = "Связь с облаком установлена";
        } else {
            indicator.classList.remove('bg-emerald-500', 'shadow-[0_0_8px_rgba(16,185,129,0.8)]');
            indicator.classList.add('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
            indicator.title = "Нет связи с облаком";
        }
    }

    async function startApp() {
        try {
            if (window.__initialAuthToken) {
                await signInWithCustomToken(auth, window.__initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    updateCloudIndicator(true);

                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'activated_users', user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists() && docSnap.data().progress) {
                            window.currentLevel = docSnap.data().progress;
                            localStorage.setItem('academy_access_granted', 'true');
                            if (typeof window.renderModules === 'function') window.renderModules();
                        }
                    } catch (e) {
                        console.error("Ошибка при загрузке прогресса", e);
                    }
                } else {
                    updateCloudIndicator(false);
                }
            });
        } catch (error) {
            console.error("Ошибка авторизации:", error);
            updateCloudIndicator(false);
        }
    }

    window.getPublicDataRef = (collectionName) => 
        collection(db, 'artifacts', appId, 'public', 'data', collectionName);

    window.getUserDataRef = (collectionName) => 
        collection(db, 'artifacts', appId, 'users', auth.currentUser?.uid, collectionName);

    window.db = db;
    window.auth = auth;
    window.appId = appId;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
    window.updateDoc = updateDoc;
    window.collection = collection;
    window.query = query;
    window.onSnapshot = onSnapshot;
    window.currentUser = currentUser;

    startApp();
</script>

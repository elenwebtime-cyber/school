<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Удалили Google Font: Apple стиль использует системные шрифты устройства -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --accent: #a855f7;
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.6); /* Чуть прозрачнее для эффекта стекла */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.015em; /* Изящный отступ между буквами */
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 25%);
            color: #fafafa;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step-active {
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .step-locked {
            opacity: 0.4;
            filter: grayscale(0.8);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Apple Style: Полустеклянные кнопки */
        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Изящные шрифты для заголовков, чтобы не сливались */
        h1, h2, h3, .tracking-tight {
            letter-spacing: 0.03em !important;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="p-4 pb-20" oncontextmenu="return false;">

    <header class="flex justify-between items-center mb-8 pt-4">
        <div>
            <div class="flex items-center gap-2">
                <h1 id="academy-name" class="text-2xl font-extrabold tracking-tight" onclick="handleAdminTrigger()">Cyber Academy</h1>
                <div id="cloud-indicator" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-colors duration-500" title="Нет связи с облаком"></div>
            </div>
            <div class="flex items-center gap-2 mt-1">
                <div class="h-1.5 w-24 bg-zinc-800 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-purple-500 transition-all duration-500" style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-[10px] text-zinc-400 font-bold uppercase tracking-tighter">0% Пройдено</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="admin-btn" onclick="openAdmin()" class="hidden w-12 h-12 rounded-2xl bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center transition-all">
                <i data-lucide="settings" class="text-zinc-400 w-6 h-6"></i>
            </button>
            <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center">
                <i data-lucide="zap" class="text-purple-500 w-6 h-6"></i>
            </div>
        </div>
    </header>

    <div id="modules-container" class="space-y-4"></div>

    <div id="access-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto flex items-center justify-center">
        <div class="p-6 w-full max-w-md flex flex-col">
            <div class="glass-card p-6 space-y-6 relative">
                <button onclick="closeAccessModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <div class="text-center">
                    <div class="w-16 h-16 bg-purple-500/10 rounded-2xl mx-auto flex items-center justify-center mb-4 border border-purple-500/20">
                        <i data-lucide="lock" class="w-8 h-8 text-purple-400"></i>
                    </div>
                    <h2 class="text-xl font-bold mb-2">Доступ закрыт</h2>
                    <p class="text-zinc-400 text-sm">Введите личный код доступа, который вы получили для входа на курс.</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="access-code-input" placeholder="Введите код..." class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center tracking-widest text-lg font-mono outline-none focus:border-purple-500 transition-all">
                    <button onclick="checkAccessCode()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm">
                        Отправить код
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="lesson-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto">
        <div class="p-6 min-h-screen flex flex-col">
            <button onclick="closeLesson()" class="flex items-center gap-2 text-zinc-400 mb-6 text-sm">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> Назад к программе
            </button>

            <div class="glass-card p-4 mb-6">
                <div class="video-container mb-4 relative" oncontextmenu="return false;" ondragstart="return false;">
                    <!-- Удалили sandbox для корректной работы Яндекс Диска и других плееров -->
                    <iframe id="lesson-video" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; gyroscope" allowfullscreen></iframe>
                    
                    <!-- Защитный слой сверху (скрывает названия и кнопку Поделиться), оставляя элементы управления снизу полностью открытыми -->
                    <div class="absolute top-0 left-0 w-full h-[70px] z-10 bg-transparent"></div>
                    <!-- Защитный слой правый нижний угол (скрывает логотип YouTube над панелью управления) -->
                    <div class="absolute bottom-[45px] right-0 w-[100px] h-[60px] z-10 bg-transparent"></div>
                </div>
                <h2 id="lesson-title" class="text-xl font-bold mb-2"></h2>
                <p id="lesson-desc" class="text-zinc-400 text-sm leading-relaxed mb-4">
                    В этом уроке мы изучим основы работы с нейросетями и разберем первые шаги.
                </p>
                <a id="lesson-pdf-btn" href="#" target="_blank" class="hidden flex items-center justify-center gap-2 w-full bg-zinc-800 hover:bg-zinc-700 text-sm font-bold py-3 rounded-xl mb-4 transition-all">
                    <i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i> Скачать материалы
                </a>
                <div class="flex items-center gap-3 p-3 bg-purple-500/5 border border-purple-500/10 rounded-xl">
                    <i data-lucide="alert-circle" class="text-purple-500 w-5 h-5"></i>
                    <div>
                        <p class="text-[10px] text-purple-300 font-bold uppercase">Дедлайн сдачи:</p>
                        <p id="lesson-deadline-timer" class="text-sm font-mono font-bold">00:00:00</p>
                    </div>
                </div>
            </div>

            <div class="mt-auto space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Ссылка на домашнее задание</label>
                    <input type="url" id="hw-input" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                </div>
                <button onclick="submitHomework()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm mt-4">
                    Отправить работу
                </button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto">
        <div class="p-6 min-h-screen flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Админ-панель</h2>
                <button onclick="closeAdmin()" class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div class="glass-card p-4 space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Название курса</label>
                        <input type="text" id="admin-academy-name" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Мастер-код доступа (глобальный)</label>
                        <input type="text" id="admin-secret-code" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                    </div>
                </div>

                <div class="glass-card p-4 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-purple-400 uppercase tracking-widest">Модули</h3>
                        <button onclick="adminAddModule()" class="text-xs bg-purple-500/10 text-purple-400 px-3 py-1.5 rounded-lg border border-purple-500/20 hover:bg-purple-500/20 transition-all flex items-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i> Добавить
                        </button>
                    </div>
                    <div id="admin-modules-list" class="space-y-2"></div>
                </div>

                <div class="glass-card p-4 space-y-4">
                    <h3 class="font-bold text-sm text-purple-400 uppercase tracking-widest">Ученики</h3>
                    <div id="admin-users-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="mt-auto pt-6">
                <button onclick="saveAdminChanges()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm">
                    Сохранить изменения
                </button>
            </div>
        </div>
    </div>

    <div id="admin-module-edit-modal" class="fixed inset-0 z-50 bg-black/95 hidden overflow-y-auto">
        <div class="p-6 min-h-screen flex flex-col">
            <button onclick="closeAdminModuleEdit()" class="flex items-center gap-2 text-zinc-400 mb-6 text-sm">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> Назад к админке
            </button>

            <h2 class="text-xl font-bold mb-6">Редактирование урока</h2>
            
            <input type="hidden" id="edit-mod-idx">

            <div class="space-y-4 mb-6">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Название урока</label>
                    <input type="text" id="edit-mod-title" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Описание</label>
                    <textarea id="edit-mod-desc" rows="3" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all"></textarea>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Ссылка на видео (YouTube, Rutube, Berrycast, Яндекс Диск)</label>
                    <input type="url" id="edit-mod-video" placeholder="https://... или код <iframe> с Яндекс Диска" oninput="updateAdminVideoPreview()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                    <div class="video-container mt-2 relative">
                        <!-- Удалили sandbox для корректной работы Яндекс Диска и других плееров -->
                        <iframe id="edit-mod-video-preview" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; gyroscope" allowfullscreen></iframe>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Ссылка на документ (PDF/Материалы)</label>
                    <input type="url" id="edit-mod-pdf" placeholder="https://диск..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase text-zinc-500 ml-1 font-bold">Дедлайн сдачи</label>
                    <input type="datetime-local" id="edit-mod-deadline" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-purple-500 transition-all [color-scheme:dark]">
                </div>
            </div>

            <div class="mt-auto">
                <button onclick="saveAdminModuleEdit()" class="w-full btn-primary py-4 rounded-2xl font-bold uppercase tracking-widest text-sm">
                    Сохранить урок
                </button>
            </div>
        </div>
    </div>

    <script>
        const academyData = {
            name: "Нейросети: Мастер",
            secretCode: "VIP2026",
            modules: [
                { id: 1, title: "Основы генерации", video: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", desc: "Узнаем как писать первые промпты.", deadline: "2026-03-01T12:00", pdfUrl: "" },
                { id: 2, title: "Работа с цветом", video: "", desc: "Глубокое погружение в колористику ИИ.", deadline: "2026-03-05T12:00", pdfUrl: "" },
                { id: 3, title: "Финальный проект", video: "", desc: "Создаем полноценный кейс для портфолио.", deadline: "2026-03-10T12:00", pdfUrl: "" },
                { id: 4, title: "Монетизация навыков", video: "", desc: "Учимся искать клиентов и продавать свои работы.", deadline: "2026-03-15T12:00", pdfUrl: "" }
            ]
        };

        window.academyData = academyData;

        window.saveAcademyDataToCloud = async function() {
            if (window.db && window.setDoc && window.doc) {
                try {
                    await window.setDoc(window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'config', 'academy_info'), window.academyData);
                } catch(e) {
                    console.error("Ошибка сохранения данных", e);
                }
            }
        };

        let currentLevel = 1;
        let isAccessGranted = localStorage.getItem('academy_access_granted') === 'true';
        let currentViewedLesson = 0;

        window.syncCloudData = function(level, access) {
            currentLevel = level;
            isAccessGranted = access;
            renderModules();
        };

        function init() {
            document.getElementById('academy-name').innerText = academyData.name;
            renderModules();
            lucide.createIcons();
        }

        function renderModules() {
            const container = document.getElementById('modules-container');
            container.innerHTML = '';
            
            const progress = ((currentLevel - 1) / academyData.modules.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${Math.round(progress)}% Пройдено`;

            academyData.modules.forEach((mod, idx) => {
                const isLocked = (idx + 1) > currentLevel;
                const isDone = (idx + 1) < currentLevel;
                const isActive = (idx + 1) === currentLevel;

                container.innerHTML += `
                    <div class="glass-card p-5 flex items-center justify-between ${isActive ? 'step-active' : ''} ${isLocked ? 'step-locked' : ''}" 
                         onclick="${!isLocked ? `openLesson(${idx})` : ''}">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl ${isDone ? 'bg-emerald-500/10' : 'bg-zinc-800'} flex items-center justify-center text-sm font-bold">
                                ${isDone ? '<i data-lucide="check" class="text-emerald-500 w-5 h-5"></i>' : idx + 1}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm">${mod.title}</h3>
                                <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-tighter">
                                    ${isLocked ? 'Доступ закрыт' : 'Нажми, чтобы войти'}
                                </p>
                            </div>
                        </div>
                        ${isActive ? '<div class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></div>' : ''}
                    </div>
                `;
            });
            lucide.createIcons();
        }

        async function grantAccess() {
            isAccessGranted = true;
            localStorage.setItem('academy_access_granted', 'true');
            
            if (window.auth && window.auth.currentUser && window.setDoc && window.doc && window.db) {
                const uid = window.auth.currentUser.uid;
                const nickname = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || 
                                 window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || 
                                 "Студент " + uid.substring(0, 4);
                
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users', uid);
                
                let existingProgress = currentLevel;
                try {
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().progress) {
                        existingProgress = Math.max(existingProgress, docSnap.data().progress);
                    }
                } catch (e) { console.error(e); }

                if (existingProgress === 0) existingProgress = 1; // Устанавливаем прогресс 1 (активирован)
                currentLevel = existingProgress;

                await window.setDoc(docRef, {
                    nickname: nickname,
                    progress: currentLevel,
                    activatedAt: new Date().toISOString()
                }, { merge: true });
            }

            closeAccessModal();
            renderModules(); 
            openLesson(0);
        }

        async function checkAccessCode() {
            const inputCode = document.getElementById('access-code-input').value.trim();
            
            // Проверка на мастер-код (остается на всякий случай)
            if (inputCode === academyData.secretCode) {
                await grantAccess();
                return;
            }

            // Проверка на личный секретный код ученика из базы данных
            if (window.auth && window.auth.currentUser && window.db) {
                const uid = window.auth.currentUser.uid;
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'activated_users', uid);
                try {
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().secretCode === inputCode) {
                        await grantAccess();
                        return;
                    }
                } catch (e) { console.error(e); }
            }

            alert('Неверный код доступа!');
        }

        function closeAccessModal() {
            document.getElementById('access-modal').classList.add('hidden');
        }

        function openLesson(idx) {
            // Если курс закрыт, отправляем на ввод пароля
            if (idx === 0 && !isAccessGranted) {
                document.getElementById('access-code-input').value = '';
                document.getElementById('access-modal').classList.remove('hidden');
                return;
            }

            currentViewedLesson = idx;
            
            const mod = academyData.modules[idx];
            document.getElementById('lesson-title').innerText = mod.title;
            document.getElementById('lesson-desc').innerText = mod.desc;
            document.getElementById('lesson-video').src = formatVideoUrl(mod.video) || '';
            
            const pdfBtn = document.getElementById('lesson-pdf-btn');
            if (mod.pdfUrl) {
                pdfBtn.href = mod.pdfUrl;
                pdfBtn.classList.remove('hidden');
            } else {
                pdfBtn.classList.add('hidden');
            }

            const d = new Date(mod.deadline);
            document.getElementById('lesson-deadline-timer').innerText = !isNaN(d) ? d.toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit'}) : "Не установлен";

            document.getElementById('lesson-modal').classList.remove('hidden');
        }

        function closeLesson() {
            document.getElementById('lesson-modal').classList.add('hidden');
            document.getElementById('lesson-video').src = '';
        }

        function submitHomework() {
            const hwInput = document.getElementById('hw-input').value.trim();
            const urlPattern = /^(https?:\/\/)/i;
            if (!urlPattern.test(hwInput)) {
                alert('Ошибка! Можно вводить только ссылки (строка должна начинаться с http:// или https://)');
                return;
            }

            // --- Отправка данных в Telegram-бот ---
            if (window.sendToTelegram) {
                const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user || {};
                const firstName = tgUser.first_name || "Неизвестный";
                const lastName = tgUser.last_name || "";
                const fullName = `${firstName} ${lastName}`.trim();
                const username = tgUser.username || "";
                
                const loginText = username ? `@${username}` : "Скрыт";
                const chatLink = username ? `<a href="https://t.me/${username}">ОТКРЫТЬ ЧАТ</a>` : "<i>Нет юзернейма</i>";
                
                const mod = academyData.modules[currentViewedLesson];
                const moduleTitle = mod.title;
                const hwLink = hwInput;
                
                const now = new Date();
                const deadlineDate = new Date(mod.deadline);
                let statusText = "Вовремя ✅";
                
                if (!isNaN(deadlineDate) && now > deadlineDate) {
                    statusText = "После дедлайна 🚩";
                }
                
                const submitTime = now.toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit'});

                const tgMessage = `
<b>Ученик:</b> ${fullName}
<b>Контакт:</b> ${loginText}
${chatLink}

<b>Модуль:</b> ${moduleTitle}
<b>Ссылка на ДЗ:</b> <a href="${hwLink}">Перейти к работе</a>
<b>Статус:</b> ${statusText}
<b>Время и дата сдачи:</b> ${submitTime}
                `.trim();

                window.sendToTelegram(tgMessage);
            }

            alert('Заинька, работа отправлена! Ты молодец!');
            
            if (currentViewedLesson + 1 === currentLevel) {
                currentLevel++;

                if (window.auth && window.auth.currentUser && window.setDoc && window.doc && window.db) {
                    const uid = window.auth.currentUser.uid;

        function formatVideoUrl(url) {
            if (!url) return '';
            let formattedUrl = url.trim();
            
            // Если вставили код <iframe> (например, из Яндекс Диска)
            if (formattedUrl.toLowerCase().includes('<iframe') && formattedUrl.toLowerCase().includes('src=')) {
                const match = formattedUrl.match(/src=["'](.*?)["']/);
                if (match) {
                    // Исправляем сломанные символы &amp;, из-за которых в Яндексе был черный экран
                    formattedUrl = match[1].replace(/&amp;/g, '&');
                }
            }
            
            // YouTube (поддержка обычных, коротких и embed ссылок)
            if (formattedUrl.includes('youtube.com/') || formattedUrl.includes('youtu.be/')) {
                let videoId = '';
                if (formattedUrl.includes('youtu.be/')) {
                    videoId = formattedUrl.split('youtu.be/')[1].split('?')[0];
                } else if (formattedUrl.includes('watch?v=')) {
                    videoId = formattedUrl.split('v=')[1].split('&')[0];
                } else if (formattedUrl.includes('embed/')) {
                    videoId = formattedUrl.split('embed/')[1].split('?')[0];
                }
                if (videoId) {
                    return `https://www.youtube.com/embed/${videoId}?modestbranding=1&rel=0&showinfo=0`;
                }
            }
            
            // Rutube (правильная обработка открытых и закрытых/private видео)
            if (formattedUrl.includes('rutube.ru/')) {
                try {
                    const urlObj = new URL(formattedUrl.startsWith('http') ? formattedUrl : 'https://' + formattedUrl);
                    const paths = urlObj.pathname.split('/').filter(Boolean);
                    
                    if (paths.includes('embed')) return formattedUrl;
                    
                    const vid = paths[paths.length - 1];
                    const query = urlObj.search;
                    
                    if (paths.includes('private')) {
                        return `https://rutube.ru/play/embed/${vid}/${query}`;
                    } else {
                        return `https://rutube.ru/play/embed/${vid}/`;
                    }
                } catch(e) {
                    console.error(e);
                }
            }

            // Berrycast (умная подстановка /embed без поломки параметров)
            if (formattedUrl.includes('berrycast.com/')) {
                const berryMatch = formattedUrl.match(/berrycast\.com\/conversations\/([a-zA-Z0-9\-]+)/);
                if (berryMatch) {
                    formattedUrl = `https://www.berrycast.com/embed/${berryMatch[1]}`;
                }
            }
            
            return formattedUrl;
        }

            return;
        }

        const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: messageText,
                    parse_mode: "HTML"
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Ошибка отправки в Telegram:", errorText);
            }
        } catch (error) {
            console.error("Ошибка отправки в Telegram:", error);

    async function startApp() {
        try {
            if (window.__initialAuthToken) {

                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;

                    try {
                        // Загружаем глобальные настройки курса из базы
                        const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'academy_info');

    window.deleteDoc = deleteDoc;
    window.collection = collection;
    window.query = query;

    window.currentUser = currentUser;

    startApp();
</script>
